[project]
name = "pmsim"
version = "0.1.0"
description = "Polymarket simulator and strategy backtester (never places real orders)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "websockets>=12.0",
    "duckdb>=1.0",
    "polars>=1.0",
    "matplotlib>=3.8",
]

[project.scripts]
pmsim = "pmsim.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pmsim"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src/pmsim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>polysim</title>
  <link rel="stylesheet" href="app.css">
  <script>
    try {
      const t = localStorage.getItem("pmsim-theme");
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-row">
      <a class="brand" href="#markets" aria-label="polysim home">
        <span class="brand-name">polysim</span>
        <span class="brand-tag">Paper money</span>
      </a>
      <label class="search">
        <input id="search" type="search" placeholder="Search Polymarket" aria-label="Search markets" autocomplete="off">
      </label>
      <div class="top-actions">
        <a class="balance" href="#portfolio" id="balance-portfolio"><span>Portfolio</span><b class="num">-</b></a>
        <a class="balance" href="#portfolio" id="balance-cash"><span>Cash</span><b class="num">-</b></a>
        <button class="ghost-btn" id="theme-btn" type="button" aria-label="Switch theme">Auto</button>
      </div>
    </div>
    <nav class="tabs" aria-label="Sections">
      <a class="tab" data-view="markets" href="#markets">Markets</a>
      <a class="tab" data-view="portfolio" href="#portfolio">Portfolio</a>
      <a class="tab" data-view="bots" href="#bots">Bots</a>
      <a class="tab" data-view="lab" href="#lab">Strategy lab</a>
    </nav>
  </header>

  <main id="app" aria-live="polite"></main>
  <div id="modal-root"></div>
  <div id="toasts" aria-live="assertive"></div>

  <footer>
    polysim is a local simulator with live data from Polymarket's public API. Trades use paper money and never reach
    Polymarket. Not affiliated with Polymarket.
  </footer>

  <script src="app.js"></script>
</body>
</html>
